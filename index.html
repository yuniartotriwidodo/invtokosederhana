<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Inventory App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showScreen('home')">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showScreen('barang')">Data Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showScreen('harga')">Data Harga</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showScreen('inventory')">Data Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showScreen('settings')">Pengaturan</a></li>
                    <li class="nav-item"><hr class="dropdown-divider"></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Keluar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4" id="content">
        <!-- Home Screen -->
        <div id="home" class="screen">
            <h2>Beranda</h2>
            <button class="btn btn-primary btn-lg mb-3" onclick="startScan()">Scan Barcode</button>
            <form id="transactionForm">
                <div class="row">
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="kode" placeholder="KODE" readonly></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="nama" placeholder="NAMA" readonly></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="kelompok" placeholder="KELOMPOK" readonly></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="jenis" placeholder="JENIS" readonly></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="warna" placeholder="WARNA" readonly></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="ukuran" placeholder="UKURAN" readonly></div>
                    <div class="col-md-12 mb-3"><textarea class="form-control" id="catatan" placeholder="CATATAN" readonly></textarea></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="medsos" placeholder="MEDSOS" readonly></div>
                    <div class="col-md-6 mb-3"><img id="photo" class="img-fluid" style="max-width: 100px;"></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="hargajual" placeholder="HARGAJUAL" readonly></div>
                </div>
                <button type="button" class="btn btn-danger me-2" onclick="cancelTransaction()">CANCEL</button>
                <button type="button" class="btn btn-success" onclick="processTransaction()">TRANSAKSI</button>
            </form>
        </div>

        <!-- Data Barang Screen -->
        <div id="barang" class="screen d-none">
            <h2>Data Barang</h2>
            <form id="barangForm">
                <div class="row">
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="bKode" placeholder="KODE" required></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="bNama" placeholder="NAMA" required></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="bKelompok" placeholder="KELOMPOK"></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="bJenis" placeholder="JENIS"></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="bWarna" placeholder="WARNA"></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="bUkuran" placeholder="UKURAN"></div>
                    <div class="col-md-12 mb-3"><textarea class="form-control" id="bCatatan" placeholder="CATATAN"></textarea></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="bMedsos" placeholder="MEDSOS"></div>
                    <div class="col-md-6 mb-3"><input type="file" class="form-control" id="bPhoto" accept="image/*"></div>
                </div>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
        </div>

        <!-- Data Harga Screen -->
        <div id="harga" class="screen d-none">
            <h2>Data Harga</h2>
            <form id="hargaForm">
                <div class="row">
                    <div class="col-md-6 mb-3"><select class="form-select" id="hKode" required><option>Pilih KODE</option></select></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="hTanggal" disabled></div>
                    <div class="col-md-6 mb-3"><input type="number" class="form-control" id="hHargaDasar" placeholder="HARGADASAR"></div>
                    <div class="col-md-6 mb-3"><input type="number" class="form-control" id="hDiskon" placeholder="DISKON (%)"></div>
                    <div class="col-md-6 mb-3"><input type="number" class="form-control" id="hPajak" placeholder="PAJAK (%)"></div>
                    <div class="col-md-6 mb-3"><input type="number" class="form-control" id="hMargin" placeholder="MARGIN (%)"></div>
                    <div class="col-md-6 mb-3"><input type="number" class="form-control" id="hHargaJual" disabled></div>
                    <div class="col-md-12 mb-3"><textarea class="form-control" id="hCatatan" placeholder="CATATAN"></textarea></div>
                </div>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
        </div>

        <!-- Data Inventory Screen -->
        <div id="inventory" class="screen d-none">
            <h2>Data Inventory</h2>
            <form id="inventoryForm">
                <div class="row">
                    <div class="col-md-6 mb-3"><select class="form-select" id="iKode" required><option>Pilih KODE</option></select></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="iTanggal" disabled></div>
                    <div class="col-md-6 mb-3"><input type="number" class="form-control" id="iTambah" placeholder="TAMBAH"></div>
                    <div class="col-md-6 mb-3"><input type="number" class="form-control" id="iKurang" disabled></div>
                    <div class="col-md-6 mb-3"><input type="number" class="form-control" id="iStok" disabled></div>
                    <div class="col-md-6 mb-3"><input type="text" class="form-control" id="iNamaTransaksi" value="TAMBAHSTOK" readonly></div>
                    <div class="col-md-12 mb-3"><textarea class="form-control" id="iCatatan" placeholder="CATATAN"></textarea></div>
                </div>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
        </div>

        <!-- Pengaturan Screen -->
        <div id="settings" class="screen d-none">
            <h2>Pengaturan</h2>
            <form id="settingsForm">
                <div class="mb-3"><input type="url" class="form-control" id="sheetLink" placeholder="Link Google Sheets API" required></div>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
