<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Blue Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .screen { transition: all 0.3s ease-in-out; }
        .hidden-screen { display: none; transform: translateX(20px); opacity: 0; }
        .active-screen { display: block; transform: translateX(0); opacity: 1; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        /* Floating Animation */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        .float-icon { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="text-slate-900">

    <!-- Header & Navigation -->
    <nav class="bg-blue-600 text-white shadow-md fixed w-full top-0 z-50">
        <div class="max-w-md mx-auto px-5 py-4 flex justify-between items-center">
            <div class="font-bold text-xl tracking-tight flex items-center">
                <div class="bg-white text-blue-600 p-1.5 rounded-lg mr-2 shadow-sm">
                    <i class="fas fa-store"></i>
                </div>
                Toko<span class="font-light text-blue-100">Blue</span>
            </div>
            <button id="menuBtn" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-blue-500 transition">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
        <!-- Dropdown Menu -->
        <div id="mobileMenu" class="hidden bg-blue-700 absolute w-full shadow-2xl border-t border-blue-500">
            <a href="#" onclick="nav('home')" class="flex items-center px-6 py-4 hover:bg-blue-600 border-b border-blue-600/50"><i class="fas fa-home w-8 opacity-70"></i> Beranda</a>
            <a href="#" onclick="nav('barang')" class="flex items-center px-6 py-4 hover:bg-blue-600 border-b border-blue-600/50"><i class="fas fa-box w-8 opacity-70"></i> Data Barang</a>
            <a href="#" onclick="nav('harga')" class="flex items-center px-6 py-4 hover:bg-blue-600 border-b border-blue-600/50"><i class="fas fa-tag w-8 opacity-70"></i> Atur Harga</a>
            <a href="#" onclick="nav('inventory')" class="flex items-center px-6 py-4 hover:bg-blue-600 border-b border-blue-600/50"><i class="fas fa-warehouse w-8 opacity-70"></i> Stok Opname</a>
            <a href="#" onclick="nav('setting')" class="flex items-center px-6 py-4 hover:bg-blue-600"><i class="fas fa-cog w-8 opacity-70"></i> Pengaturan</a>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-4 max-w-md mx-auto min-h-screen">

        <!-- SCREEN: BERANDA (KASIR) -->
        <div id="screen-home" class="screen active-screen">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl shadow-xl p-8 text-center text-white mb-6 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/10 rounded-full blur-3xl"></div>
                <h2 class="text-lg font-medium opacity-80 mb-6">Kasir Digital</h2>
                
                <div id="reader" class="bg-black rounded-2xl overflow-hidden mx-auto mb-4 hidden border-4 border-white/20" style="width: 100%;"></div>
                
                <button id="btnScan" onclick="startScan()" class="bg-white text-blue-600 w-24 h-24 rounded-full shadow-2xl flex items-center justify-center mx-auto text-4xl hover:scale-105 active:scale-95 transition-all ring-8 ring-white/10 group">
                    <i class="fas fa-qrcode group-hover:rotate-12 transition-transform"></i>
                </button>
                <p class="mt-4 text-sm font-medium tracking-wide uppercase opacity-70">Tap untuk Scan</p>
            </div>

            <div class="bg-white rounded-3xl shadow-sm p-6 border border-slate-200">
                <div class="space-y-4">
                    <div class="flex items-center space-x-4 mb-4">
                        <div id="transPhotoPlaceholder" class="h-20 w-20 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-400 shrink-0 border-2 border-dashed border-slate-200">
                            <i class="fas fa-image text-2xl"></i>
                        </div>
                        <img id="transPhoto" class="h-20 w-20 object-cover rounded-2xl border-2 border-blue-100 hidden shrink-0 shadow-sm">
                        <div class="flex-1">
                            <input type="text" id="transNama" class="w-full text-lg font-bold text-slate-800 placeholder:text-slate-300 bg-transparent border-none focus:ring-0 p-0" placeholder="Nama Barang..." readonly>
                            <input type="text" id="transKategori" class="text-xs font-semibold text-blue-500 uppercase tracking-wider bg-transparent border-none focus:ring-0 p-0" placeholder="KATEGORI" readonly>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Stok Tersedia</label>
                            <input type="text" id="transStok" class="w-full bg-transparent text-lg font-bold text-slate-700" readonly value="0">
                        </div>
                        <div class="bg-green-50 p-3 rounded-2xl border border-green-100">
                            <label class="block text-[10px] font-bold text-green-600 uppercase mb-1">Harga Satuan</label>
                            <div class="flex items-center">
                                <span class="text-green-600 font-bold mr-1">Rp</span>
                                <input type="text" id="transHarga" class="w-full bg-transparent text-lg font-black text-green-700" readonly value="0">
                            </div>
                        </div>
                    </div>

                    <div class="flex space-x-3 pt-4">
                        <button onclick="cancelTrans()" class="flex-1 py-4 px-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition active:scale-95">BATAL</button>
                        <button onclick="processTrans()" class="flex-[2] py-4 px-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition active:scale-95 flex items-center justify-center space-x-2">
                            <span>PROSES</span>
                            <i class="fas fa-chevron-right text-xs opacity-50"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Hidden Fields -->
            <input type="hidden" id="transKode">
            <input type="hidden" id="rawPrice">
            <input type="hidden" id="rawStock">
        </div>

        <!-- SCREEN: INPUT BARANG -->
        <div id="screen-barang" class="screen hidden-screen">
            <div class="bg-white rounded-3xl shadow-sm p-7 border border-slate-200">
                <h2 class="text-xl font-bold mb-6 text-slate-800 flex items-center">
                    <span class="w-2 h-8 bg-blue-600 rounded-full mr-3"></span>
                    Tambah Barang
                </h2>
                <form onsubmit="event.preventDefault(); saveBarang();" class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">Informasi Dasar</label>
                        <input type="text" id="brgKode" placeholder="Kode Barcode / SKU" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition" required>
                        <input type="text" id="brgNama" placeholder="Nama Produk Lengkap" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition" required>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="brgKelompok" placeholder="Kategori" class="p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm">
                        <input type="text" id="brgJenis" placeholder="Jenis/Tipe" class="p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm">
                    </div>

                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                        <label class="block text-center cursor-pointer group">
                            <div id="brgPreviewContainer" class="mb-2 hidden">
                                <img id="brgPreview" class="w-full h-48 object-cover rounded-xl shadow-inner">
                                <p class="text-[10px] text-blue-500 mt-2 font-bold">KLIK UNTUK GANTI FOTO</p>
                            </div>
                            <div id="brgPhotoPrompt">
                                <i class="fas fa-camera text-3xl text-blue-500 mb-2 float-icon"></i>
                                <span class="block text-blue-600 text-sm font-bold uppercase tracking-tight">Ambil Foto Produk</span>
                                <span class="text-[10px] text-blue-400 italic">Otomatis dikecilkan agar hemat memori</span>
                            </div>
                            <input type="file" id="brgPhoto" accept="image/*" class="hidden" onchange="processAndPreviewImage(this)">
                        </label>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all mt-6 active:scale-95">
                        SIMPAN DATA
                    </button>
                </form>
            </div>
        </div>

        <!-- SCREEN: SETTING -->
        <div id="screen-setting" class="screen hidden-screen">
            <div class="bg-white rounded-3xl shadow-sm p-7 border border-slate-200">
                <h2 class="text-xl font-bold mb-4 text-slate-800 flex items-center">
                    <span class="w-2 h-8 bg-slate-800 rounded-full mr-3"></span>
                    Konfigurasi
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Google Web App URL</label>
                        <textarea id="settingUrl" rows="5" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-mono text-xs focus:ring-4 focus:ring-blue-100 outline-none transition" placeholder="https://script.google.com/macros/s/.../exec"></textarea>
                    </div>
                    <button onclick="saveSetting()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transition shadow-lg active:scale-95">
                        <i class="fas fa-check-circle mr-2"></i> Update Konfigurasi
                    </button>
                </div>
            </div>
        </div>

        <!-- Tambahkan Screen lainnya (Harga & Inventory) dengan struktur serupa jika diperlukan -->

    </main>

    <script>
        // --- CONFIG & GLOBAL STATE ---
        let API_URL = localStorage.getItem('tokoAppUrl') || '';
        let html5QrcodeScanner = null;
        let base64Image = "";

        // --- UTILS ---
        const getNow = () => new Date().toLocaleString('sv-SE').replace('T', ' ');
        const formatIDR = (val) => new Intl.NumberFormat('id-ID').format(val);

        // --- UI NAVIGATION ---
        function nav(screenName) {
            document.getElementById('mobileMenu').classList.add('hidden');
            const screens = document.querySelectorAll('.screen');
            screens.forEach(s => {
                s.classList.add('hidden-screen');
                s.classList.remove('active-screen');
            });
            
            const target = document.getElementById(`screen-${screenName}`);
            target.classList.remove('hidden-screen');
            setTimeout(() => target.classList.add('active-screen'), 50);

            if(screenName === 'home') resetTransForm();
        }

        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        });

        // --- IMAGE COMPRESSION LOGIC (CANVAS) ---
        function processAndPreviewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        // Max Dimensions (E.g. 400px)
                        const maxW = 400;
                        const scale = maxW / img.width;
                        const canvas = document.createElement('canvas');
                        canvas.width = maxW;
                        canvas.height = img.height * scale;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // Compress to JPEG with 0.6 quality to stay under 50kb
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
                        
                        base64Image = compressedBase64;
                        document.getElementById('brgPreview').src = compressedBase64;
                        document.getElementById('brgPreviewContainer').classList.remove('hidden');
                        document.getElementById('brgPhotoPrompt').classList.add('hidden');
                    }
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- API ACTIONS ---
        async function submitToSheet(sheetName, rowData, onSuccess) {
            if(!API_URL) return Swal.fire('Error', 'Set URL di Pengaturan', 'warning');
            Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                // Post as text/plain to bypass CORS Preflight on GAS
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify({ sheet: sheetName, data: rowData }),
                    headers: { "Content-Type": "text/plain" },
                });

                Swal.fire({ icon: 'success', title: 'Berhasil', timer: 1000, showConfirmButton: false });
                if(onSuccess) onSuccess();
            } catch (error) {
                Swal.fire('Oops', 'Cek koneksi internet', 'error');
            }
        }

        function saveBarang() {
            const data = [
                document.getElementById('brgKode').value.toUpperCase(),
                document.getElementById('brgNama').value,
                document.getElementById('brgKelompok').value,
                document.getElementById('brgJenis').value,
                "", "", "", "", // Placeholder Warna, Ukuran, Catatan, Medsos
                base64Image,
                getNow()
            ];

            submitToSheet('MBARANG', data, () => {
                nav('home');
                Swal.fire('Tersimpan', 'Barang berhasil didaftarkan', 'success');
            });
        }

        // --- SCANNER & TRANSACTION ---
        function startScan() {
            const readerDiv = document.getElementById('reader');
            readerDiv.classList.remove('hidden');
            
            if(!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }

            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                { fps: 15, qrbox: { width: 250, height: 250 } },
                (text) => {
                    html5QrcodeScanner.stop();
                    readerDiv.classList.add('hidden');
                    fetchProduct(text);
                }
            ).catch(() => Swal.fire('Error', 'Kamera tidak aktif', 'error'));
        }

        async function fetchProduct(kode) {
            Swal.fire({ title: 'Mencari...', didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(`${API_URL}?op=searchBarang&q=${kode}`);
                const results = await res.json();
                
                if(results.length > 0) {
                    const item = results[0];
                    document.getElementById('transKode').value = item.KODE;
                    document.getElementById('transNama').value = item.NAMA;
                    document.getElementById('transKategori').value = item.KELOMPOK || 'UMUM';
                    document.getElementById('transHarga').value = formatIDR(item.HARGAJUAL || 0);
                    document.getElementById('transStok').value = item.STOK || 0;
                    document.getElementById('rawPrice').value = item.HARGAJUAL || 0;
                    document.getElementById('rawStock').value = item.STOK || 0;

                    if(item.PHOTO && item.PHOTO.length > 100) {
                        document.getElementById('transPhoto').src = item.PHOTO;
                        document.getElementById('transPhoto').classList.remove('hidden');
                        document.getElementById('transPhotoPlaceholder').classList.add('hidden');
                    }
                    Swal.close();
                } else {
                    Swal.fire('Tidak Ada', 'Barang belum terdaftar', 'info');
                    resetTransForm();
                }
            } catch (e) {
                Swal.fire('Error', 'Gagal koneksi ke server', 'error');
            }
        }

        function processTrans() {
            const kode = document.getElementById('transKode').value;
            if(!kode) return;

            const newStok = parseInt(document.getElementById('rawStock').value) - 1;
            const data = [ kode, getNow(), "", 1, newStok, "BELI", "Kasir App" ];

            submitToSheet('MINV', data, () => {
                Swal.fire('Sukses', 'Transaksi Berhasil', 'success');
                resetTransForm();
            });
        }

        function resetTransForm() {
            ['transKode', 'transNama', 'transKategori', 'transHarga', 'transStok', 'rawPrice', 'rawStock'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('transPhoto').classList.add('hidden');
            document.getElementById('transPhotoPlaceholder').classList.remove('hidden');
        }

        function saveSetting() {
            const url = document.getElementById('settingUrl').value;
            if(!url.includes('google.com')) return Swal.fire('Format Salah', 'Gunakan URL Google Script', 'error');
            localStorage.setItem('tokoAppUrl', url);
            API_URL = url;
            Swal.fire('Berhasil', 'Konfigurasi telah diperbarui', 'success');
        }

        // Init
        if(API_URL) document.getElementById('settingUrl').value = API_URL;
    </script>
</body>
</html>
